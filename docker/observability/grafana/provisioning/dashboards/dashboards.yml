# Painéis provisionados a partir do repositório (doc 18 §7 / doc 20 §2).
#
# `allowUiUpdates: false` de propósito: painel editado na interface e não versionado some no
# próximo deploy, e some justamente quando alguém precisa dele. Quem quiser mudar, muda o JSON
# em docker/observability/grafana/paineis/ e abre PR — o gate `pnpm obs:check` confere as
# métricas antes do merge.
apiVersion: 1

providers:
  - name: dashsgs
    orgId: 1
    folder: DashSGS
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/paineis
      foldersFromFilesStructure: false

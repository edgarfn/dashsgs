# Ambiente de desenvolvimento (doc 19 §1). Nenhum segredo real aqui.
# Uso: pnpm infra:up  |  pnpm infra:reset (apaga volumes)
name: dashsgs-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: dashsgs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: dashsgs
      # scram-sha-256 conforme doc 09 §1 (Banco)
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    ports:
      # Porta do host configurável: máquinas com Postgres local usam POSTGRES_PORT=55432 (.env)
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dashsgs']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dashsgs-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: dashsgs-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # UI — convites/reset caem aqui
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z localhost 1025']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:

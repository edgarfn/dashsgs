# DashSGS — pipeline de integração contínua (doc 11 §1 e §2).
# Todos os jobs abaixo são gates: PR só mergeia com tudo verde (branch protection).
#
# NOTA DE SEGURANÇA (doc 11 §4): as actions estão referenciadas por tag; o Renovate
# (renovate.json, preset `helpers:pinGitHubActionDigests`) converte cada uma para SHA no
# primeiro ciclo. Não afrouxar `permissions:` — o padrão aqui é somente leitura.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '10.29.3'

jobs:
  # 1-4: lint, typecheck, testes unitários com cobertura (doc 11 §2: <80% no core não mergeia).
  quality:
    name: Lint · typecheck · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: Gerar client do Prisma
        run: pnpm db:generate
      - name: Compilar pacote compartilhado
        run: pnpm --filter @dashsgs/shared build
      - name: Formatação
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes unitários + cobertura
        run: pnpm test:cov
      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage
          retention-days: 7

  # 5: SAST — bloqueia em HIGH/CRITICAL.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/jwt \
            --config p/sql-injection \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --exclude node_modules --exclude dist --exclude .next

  # 6: SCA — CRITICAL sempre bloqueia; HIGH bloqueia quando há correção disponível.
  sca:
    name: SCA (osv-scanner + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: pnpm audit (dependências de produção)
        run: pnpm audit --prod --audit-level high
      - name: osv-scanner
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:latest \
            scan source --lockfile=/src/pnpm-lock.yaml

  # 7: segredos — qualquer achado bloqueia, sem exceção (doc 11 §2).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o gate cobre commits antigos
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  # 8: build dos artefatos + validação do schema.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar schema do Prisma
        run: pnpm exec prisma validate
      - run: pnpm db:generate
      - name: Build (shared → api → web)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # 10: integração com Postgres e Redis reais — inclui o gate de drift do schema.
  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: dashsgs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dashsgs"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      PGPASSWORD: dev_only_password
      DATABASE_URL: postgresql://app_rw:dev_only_password@localhost:5432/dashsgs?schema=public
      DATABASE_URL_MIGRATOR: postgresql://app_migrator:dev_only_password@localhost:5432/dashsgs?schema=public
      SHADOW_DATABASE_URL: postgresql://app_migrator:dev_only_password@localhost:5432/dashsgs_shadow?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Criar papéis do banco (app_rw sem BYPASSRLS — doc 08 §3)
        run: psql -h localhost -U postgres -d dashsgs -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql
      - run: pnpm db:generate
      - name: Aplicar migrações
        run: pnpm db:migrate
      - name: Gate de drift (migrações × schema.prisma)
        run: pnpm db:drift
      - name: Gate de isolamento (toda tabela com tenant_id tem RLS — doc 08 §6.3)
        run: pnpm db:rls-check
      - name: Compilar pacote compartilhado
        run: pnpm --filter @dashsgs/shared build
      - name: Testes de integração
        run: pnpm test:integration

  # 9: imagens + scan de container (bloqueia CRITICAL no SO/base).
  container:
    name: Container build + Trivy
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: dashsgs-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build imagem do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          load: true
          tags: dashsgs-web:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — imagem da API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dashsgs-api:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy — imagem do web
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dashsgs-web:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # 11: E2E dos fluxos críticos (doc 17 §1) — login+MFA, recuperação, perfil.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: dashsgs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dashsgs"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      PGPASSWORD: dev_only_password
      NODE_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      PORT: '3001'
      LOG_LEVEL: warn
      SESSION_SECRET: ci_session_secret_ci_session_secret_32c
      CSRF_SECRET: ci_csrf_secret_ci_csrf_secret_32chars_ok
      COOKIE_DOMAIN: localhost
      DATABASE_URL: postgresql://app_rw:dev_only_password@localhost:5432/dashsgs?schema=public
      DATABASE_URL_MIGRATOR: postgresql://app_migrator:dev_only_password@localhost:5432/dashsgs?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_URL: http://127.0.0.1:8025
      MAIL_FROM: DashSGS <ci@dashsgs.local>
      MASTER_KEY_CURRENT: Y2lfbWFzdGVyX2tleV8zMl9ieXRlc19DSEFOR0VfTUU=
      PII_PEPPER: ci_pepper_ci_pepper_24ch
      INTERNAL_API_URL: http://127.0.0.1:3001
      SEED_PASSWORD: Senha-De-Teste-Bem-Longa-2026
      # Sem ERP de verdade no CI: as fixtures respondem no lugar dele (doc 12 §7).
      SG_MOCK: 'true'
      ALLOW_INSECURE_ERP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Criar papéis do banco
        run: psql -h localhost -U postgres -d dashsgs -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql
      - run: pnpm db:generate
      - name: Migrar e semear (dados sintéticos)
        run: pnpm db:migrate && pnpm db:seed
      - name: Build da aplicação
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_OUTPUT_STANDALONE: 'false'
      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium
      - name: Subir API e web
        run: |
          node apps/api/dist/main.js &
          pnpm --filter @dashsgs/web start &
          pnpm exec wait-on http://127.0.0.1:3001/readyz http://127.0.0.1:3000/entrar --timeout 90000
      - name: Playwright
        run: pnpm test:e2e
      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
